<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Stilucky Explorer — Cosmos Blockchain Explorer</title>
  <link rel="icon" type="image/png" href="https://raw.githubusercontent.com/stilucky/my-web/main/avail_9429136-1.png" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg:#f0f2f5; --surface:#ffffff; --card:#ffffff; --border:#e2e8f0;
      --accent:#16a34a; --accent-dim:rgba(22,163,74,.08); --accent-hover:#15803d;
      --text:#0f172a; --text2:#334155; --muted:#64748b; --muted2:#94a3b8;
      --red:#ef4444; --red-dim:rgba(239,68,68,.08);
      --yellow:#f59e0b; --yellow-dim:rgba(245,158,11,.08);
      --green:#22c55e; --green-dim:rgba(34,197,94,.08);
      --blue:#3b82f6; --blue-dim:rgba(59,130,246,.08);
      --purple:#8b5cf6; --purple-dim:rgba(139,92,246,.08);
      --sb-bg:#ffffff; --sb-w:224px;
      --topbar-bg:rgba(255,255,255,.85);
      --row-hover:#f8fafc;
      --shadow-sm:0 1px 3px rgba(0,0,0,.06),0 1px 2px rgba(0,0,0,.04);
      --shadow-md:0 4px 12px rgba(0,0,0,.08),0 2px 4px rgba(0,0,0,.04);
      --radius:10px;
    }
    [data-theme="dark"] {
      --bg:#0d1117; --surface:#161b22; --card:#1c2333; --border:#30363d;
      --accent:#22c55e; --accent-dim:rgba(34,197,94,.1); --accent-hover:#16a34a;
      --text:#e6edf3; --text2:#c9d1d9; --muted:#8b949e; --muted2:#484f58;
      --red:#f87171; --red-dim:rgba(248,113,113,.1);
      --yellow:#fbbf24; --yellow-dim:rgba(251,191,36,.1);
      --green:#4ade80; --green-dim:rgba(74,222,128,.1);
      --blue:#60a5fa; --blue-dim:rgba(96,165,250,.1);
      --purple:#a78bfa; --purple-dim:rgba(167,139,250,.1);
      --sb-bg:#0d1117; --topbar-bg:rgba(13,17,23,.85);
      --row-hover:rgba(255,255,255,.03);
      --shadow-sm:0 1px 3px rgba(0,0,0,.3);
      --shadow-md:0 4px 12px rgba(0,0,0,.4);
    }
    *{margin:0;padding:0;box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;font-weight:400;overflow-x:hidden;transition:background .2s,color .2s}

    /* ── SCROLLBAR ── */
    ::-webkit-scrollbar{width:5px;height:5px}
    ::-webkit-scrollbar-track{background:transparent}
    ::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
    ::-webkit-scrollbar-thumb:hover{background:var(--muted2)}

    /* ── PAGE FADE IN ── */
    @keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
    .content>*{animation:fadeUp .22s ease both}

    /* ── LAYOUT ── */
    .app{display:flex;min-height:100vh}
    .sidebar{width:var(--sb-w);position:fixed;top:0;left:0;bottom:0;background:var(--sb-bg);border-right:1px solid var(--border);display:flex;flex-direction:column;z-index:100;overflow-y:auto;transition:transform .25s}
    .main{margin-left:var(--sb-w);flex:1;display:flex;flex-direction:column;min-height:100vh}

    /* ── SIDEBAR BRAND ── */
    .sb-brand{padding:1rem 1rem .85rem;border-bottom:1px solid var(--border);flex-shrink:0}
    .sb-logo{font-size:1rem;font-weight:700;color:var(--text);text-decoration:none;display:flex;align-items:center;gap:.35rem;letter-spacing:-.02em}
    .sb-logo-icon{width:26px;height:26px;border-radius:7px;object-fit:cover;flex-shrink:0}
    .sb-logo span{color:var(--accent)}
    .sb-tagline{font-size:.65rem;color:var(--muted);margin-top:.3rem;letter-spacing:.01em}

    /* ── SIDEBAR SECTIONS ── */
    .sb-section{padding:.4rem .65rem;border-bottom:1px solid var(--border)}
    .sb-label{font-size:.6rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted2);padding:.5rem .35rem .25rem}
    .sb-item{display:flex;align-items:center;gap:.5rem;padding:.42rem .7rem;cursor:pointer;border-radius:7px;transition:all .15s;font-size:.8rem;color:var(--muted);font-weight:400;margin:.05rem 0}
    .sb-item:hover{background:var(--row-hover);color:var(--text2)}
    .sb-item.active{background:var(--accent-dim);color:var(--accent);font-weight:600}
    .sb-item-icon{font-size:.82rem;flex-shrink:0;width:16px;text-align:center}
    .sb-item-text{flex:1}
    .sb-badge{font-size:.6rem;font-weight:700;background:var(--border);color:var(--muted);padding:.1rem .42rem;border-radius:99px;min-width:18px;text-align:center}
    .sb-item.active .sb-badge{background:var(--accent);color:#fff}
    .sb-item:hover .sb-badge{background:var(--accent-dim);color:var(--accent)}

    /* ── CHAIN NAV HEADER ── */
    .sb-chain-hd{display:flex;align-items:center;gap:.5rem;padding:.55rem .7rem;border-bottom:1px solid var(--border);background:var(--row-hover)}
    .sb-chain-hd-logo{width:20px;height:20px;border-radius:50%;object-fit:cover;flex-shrink:0}
    .sb-chain-hd-fb{width:20px;height:20px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:.62rem;font-weight:700}
    .sb-chain-hd-name{font-size:.78rem;font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

    /* ── SIDEBAR NAV ITEMS ── */
    .nav-item{display:flex;align-items:center;gap:.45rem;padding:.38rem .7rem;cursor:pointer;font-size:.79rem;color:var(--muted);transition:all .15s;border-radius:7px;margin:.05rem 0}
    .nav-item:hover{color:var(--text2);background:var(--row-hover)}
    .nav-item.active{color:var(--accent);background:var(--accent-dim);font-weight:600}
    .nav-item::before{content:'·';margin-right:1px;opacity:.3;font-size:.9rem}
    .nav-item.active::before{opacity:1;color:var(--accent)}

    /* ── TOPBAR ── */
    .topbar{position:sticky;top:0;z-index:50;height:52px;display:flex;align-items:center;gap:.65rem;padding:0 1.5rem;background:var(--topbar-bg);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--border);flex-shrink:0}
    .hbg{display:none;background:none;border:none;color:var(--muted);font-size:1.1rem;cursor:pointer;padding:.3rem;border-radius:6px}
    .hbg:hover{background:var(--row-hover);color:var(--text)}
    .tb-left{display:flex;align-items:center;gap:.55rem;flex:1;min-width:0}
    .tb-brand{font-size:.88rem;font-weight:700;color:var(--text);letter-spacing:-.02em}
    .tb-chain-logo{width:22px;height:22px;border-radius:50%;object-fit:cover;flex-shrink:0}
    .tb-chain-logo-fb{width:22px;height:22px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:.65rem;font-weight:700}
    .tb-chain-name{font-size:.88rem;font-weight:600;color:var(--text)}
    .tb-block{font-size:.76rem;color:var(--accent);font-weight:600;font-variant-numeric:tabular-nums;background:var(--accent-dim);padding:.18rem .5rem;border-radius:5px}
    .tb-chainid{font-size:.68rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:160px}
    .live-dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--green);flex-shrink:0;animation:blink 1.5s infinite}
    @keyframes blink{0%,100%{opacity:1}50%{opacity:.2}}
    .tb-search{display:flex;gap:0;flex-shrink:0}
    .tb-search input{padding:.38rem .9rem;background:var(--surface);border:1px solid var(--border);border-right:none;color:var(--text);font-family:'Inter',sans-serif;font-size:.78rem;outline:none;width:230px;transition:border-color .2s,box-shadow .2s;border-radius:8px 0 0 8px}
    .tb-search input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-dim)}
    .tb-search button{padding:.38rem .85rem;background:var(--surface);border:1px solid var(--border);color:var(--muted);cursor:pointer;font-size:.9rem;transition:all .2s;border-radius:0 8px 8px 0}
    .tb-search button:hover{color:var(--accent);border-color:var(--accent);background:var(--accent-dim)}
    .theme-btn{width:32px;height:32px;display:flex;align-items:center;justify-content:center;background:var(--surface);border:1px solid var(--border);color:var(--muted);cursor:pointer;font-size:.9rem;flex-shrink:0;transition:all .2s;border-radius:8px}
    .theme-btn:hover{color:var(--accent);border-color:var(--accent);background:var(--accent-dim)}

    /* ── CONTENT ── */
    .content{flex:1;padding:1.5rem 1.75rem}

    /* ── HOME HERO ── */
    .home-hero{margin-bottom:2rem;padding:1.5rem 1.75rem;margin:-1.5rem -1.75rem 1.5rem;background:linear-gradient(135deg,var(--accent-dim) 0%,transparent 60%);border-bottom:1px solid var(--border)}
    .home-title{font-size:1.65rem;font-weight:800;background:linear-gradient(135deg,var(--accent),#059669);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;letter-spacing:-.04em;line-height:1.2}
    .home-sub{font-size:.83rem;color:var(--muted);margin-top:.4rem;letter-spacing:.01em}

    /* ── SECTION HEADER ── */
    .sec-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:.9rem}
    .sec-title{font-size:.95rem;font-weight:700;color:var(--text);letter-spacing:-.02em}
    .chain-search{padding:.38rem .9rem;background:var(--surface);border:1px solid var(--border);color:var(--text);font-family:'Inter',sans-serif;font-size:.78rem;outline:none;border-radius:8px;width:200px;transition:border-color .2s,box-shadow .2s}
    .chain-search:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-dim)}

    /* ── FEATURED GRID ── */
    .featured-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(195px,1fr));gap:1rem;margin-bottom:2rem}
    .fc{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:1rem;cursor:pointer;transition:all .22s;position:relative;overflow:hidden}
    .fc::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--accent),#059669);opacity:0;transition:opacity .2s}
    .fc:hover{border-color:var(--accent);box-shadow:var(--shadow-md);transform:translateY(-2px)}
    .fc:hover::before{opacity:1}
    .fc-top{display:flex;align-items:center;gap:.65rem;margin-bottom:.85rem}
    .fc-logo{width:36px;height:36px;border-radius:50%;object-fit:cover;flex-shrink:0;box-shadow:0 2px 8px rgba(0,0,0,.1)}
    .fc-logo-fb{width:36px;height:36px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:.88rem;font-weight:700}
    .fc-meta{flex:1;min-width:0}
    .fc-name{font-size:.85rem;font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .fc-id{font-size:.63rem;color:var(--muted);margin-top:.1rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .fc-star{background:none;border:none;font-size:1rem;cursor:pointer;color:var(--muted2);padding:.1rem;transition:color .15s;flex-shrink:0}
    .fc-star:hover,.fc-star.on{color:#f59e0b}
    .fc-stats{display:grid;grid-template-columns:1fr 1fr;gap:.35rem}
    .fcs{background:var(--bg);border-radius:7px;padding:.38rem .5rem}
    .fcs-lbl{font-size:.58rem;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:.1rem;font-weight:600}
    .fcs-val{font-size:.76rem;font-weight:600;color:var(--text);font-variant-numeric:tabular-nums}
    .fcs-val.green{color:var(--accent)}

    /* ── ALL CHAINS GRID ── */
    .chain-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(162px,1fr));gap:.55rem}
    .cc{background:var(--card);border:1px solid var(--border);border-radius:9px;padding:.6rem .8rem;cursor:pointer;transition:all .18s;display:flex;align-items:center;gap:.6rem}
    .cc:hover{border-color:var(--accent);background:var(--accent-dim);box-shadow:var(--shadow-sm)}
    .cc-logo{width:26px;height:26px;border-radius:50%;object-fit:cover;flex-shrink:0}
    .cc-logo-fb{width:26px;height:26px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:.7rem;font-weight:700}
    .cc-name{font-size:.8rem;font-weight:500;color:var(--text);flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .cc-star{background:none;border:none;font-size:.9rem;cursor:pointer;color:var(--muted2);padding:.05rem;flex-shrink:0;transition:color .15s}
    .cc-star:hover,.cc-star.on{color:#f59e0b}

    /* ── STAT CARDS ── */
    .stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:.85rem;margin-bottom:1.5rem}
    .stat-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:.95rem 1.1rem;position:relative;overflow:hidden}
    .stat-card::after{content:'';position:absolute;bottom:0;left:0;right:0;height:2px;background:linear-gradient(90deg,var(--accent),transparent);opacity:.35}
    .sc-lbl{font-size:.62rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:.45rem}
    .sc-val{font-size:1.25rem;font-weight:800;color:var(--accent);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
    .sc-val.g{color:var(--green)}
    .sc-sub{font-size:.68rem;color:var(--muted);margin-top:.25rem}

    /* ── DUAL GRID ── */
    .dual-grid{display:grid;grid-template-columns:1fr 1fr;gap:1.1rem;margin-bottom:1.25rem}
    .full{grid-column:1/-1}

    /* ── PANEL ── */
    .panel{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:1.25rem;overflow:hidden;box-shadow:var(--shadow-sm)}
    .ph{padding:.75rem 1.1rem;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;background:var(--surface)}
    .pt{font-size:.82rem;font-weight:700;color:var(--text);letter-spacing:-.01em}
    .badge{font-size:.63rem;font-weight:600;padding:.2rem .55rem;border-radius:99px;display:inline-flex;align-items:center;gap:.3rem}
    .badge.cyan{color:var(--blue);background:var(--blue-dim)}
    .badge.green{color:var(--accent);background:var(--accent-dim)}
    .badge.red{color:var(--red);background:var(--red-dim)}
    .badge.yellow{color:var(--yellow);background:var(--yellow-dim)}
    .badge.purple{color:var(--purple);background:var(--purple-dim)}
    .badge.muted{color:var(--muted);background:var(--row-hover)}

    /* ── DATA TABLE ── */
    .data-table{width:100%;border-collapse:collapse}
    .data-table th{padding:.6rem 1rem;text-align:left;font-size:.65rem;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--border);white-space:nowrap;background:var(--surface)}
    .data-table td{padding:.65rem 1rem;border-bottom:1px solid var(--border);font-size:.78rem;color:var(--text2)}
    .data-table tr:last-child td{border-bottom:none}
    .data-table tr:hover td{background:var(--row-hover)}
    .data-table tr{cursor:pointer;transition:background .12s}
    .mono{font-family:'JetBrains Mono','Fira Code','Courier New',monospace;color:var(--blue);word-break:break-all;font-size:.75rem}
    .mono.sm{font-size:.7rem}

    /* ── ROW ITEMS ── */
    .row-item{display:flex;align-items:center;justify-content:space-between;padding:.65rem 1.1rem;border-bottom:1px solid var(--border);cursor:pointer;transition:background .12s}
    .row-item:last-child{border-bottom:none}
    .row-item:hover{background:var(--row-hover)}
    .ri-left{display:flex;align-items:center;gap:.65rem}
    .ri-icon{width:30px;height:30px;background:var(--accent-dim);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:.75rem;color:var(--accent);flex-shrink:0}
    .ri-main{font-size:.78rem;font-weight:500;color:var(--text)}
    .ri-sub{font-size:.67rem;color:var(--muted);margin-top:.1rem}
    .ri-right{text-align:right;flex-shrink:0}
    .ri-val{font-size:.75rem;font-weight:600;color:var(--accent)}
    .ri-time{font-size:.63rem;color:var(--muted);margin-top:.1rem}

    /* ── UPTIME BAR ── */
    .uptime-item{padding:.75rem 1.1rem;border-bottom:1px solid var(--border)}
    .uptime-item:last-child{border-bottom:none}
    .uptime-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:.35rem}
    .uptime-name{font-size:.78rem;color:var(--text)}
    .uptime-pct{font-size:.75rem;font-weight:600}
    .uptime-bar-bg{height:5px;background:var(--border);border-radius:3px;overflow:hidden}
    .uptime-bar-fill{height:100%;border-radius:3px;transition:width .5s}

    /* ── PARAM TABLE ── */
    .param-section{margin-bottom:1.25rem}
    .param-title{font-size:.75rem;font-weight:700;color:var(--text);padding:.7rem 1.1rem;border-bottom:1px solid var(--border);background:var(--surface);letter-spacing:.02em;text-transform:uppercase}
    .param-row{display:grid;grid-template-columns:1fr 1fr;border-bottom:1px solid var(--border)}
    .param-row:last-child{border-bottom:none}
    .param-key{padding:.52rem 1.1rem;font-size:.75rem;color:var(--muted);font-weight:500}
    .param-val{padding:.52rem 1.1rem;font-size:.75rem;color:var(--text2);word-break:break-all}

    /* ── INFO CARDS ── */
    .info-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:.75rem;margin-bottom:1.25rem}
    .info-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:.85rem 1rem;box-shadow:var(--shadow-sm)}
    .ic-lbl{font-size:.6rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:.3rem}
    .ic-val{font-size:.8rem;color:var(--text);word-break:break-all;font-weight:500}

    /* ── WIDGET CARDS ── */
    .widget-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:1rem}
    .widget-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:1.1rem;overflow:hidden;box-shadow:var(--shadow-sm)}
    .wc-title{font-size:.73rem;font-weight:700;color:var(--text);letter-spacing:.05em;text-transform:uppercase;margin-bottom:.75rem}
    .wc-embed{background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:.65rem;font-size:.62rem;color:var(--muted);margin-top:.75rem;word-break:break-all;font-family:monospace}
    .wc-copy{margin-top:.45rem;padding:.35rem .8rem;background:var(--accent-dim);border:1px solid var(--accent);color:var(--accent);font-size:.68rem;cursor:pointer;font-weight:600;transition:all .2s;border-radius:6px}
    .wc-copy:hover{background:var(--accent);color:#fff}

    /* ── MISC ── */
    .load-more{padding:.85rem;text-align:center;border-top:1px solid var(--border)}
    .btn-load{padding:.42rem 1.4rem;background:var(--surface);border:1px solid var(--border);color:var(--text2);font-size:.78rem;cursor:pointer;font-weight:500;transition:all .2s;border-radius:8px}
    .btn-load:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-dim)}
    .btn-load:disabled{opacity:.35;cursor:not-allowed}
    .p-empty{padding:2.5rem;text-align:center;font-size:.82rem;color:var(--muted)}
    .p-empty.error{color:var(--red)}

    /* ── TOAST ── */
    #toast{position:fixed;bottom:1.5rem;right:1.5rem;background:var(--text);color:var(--surface);font-size:.75rem;font-weight:500;padding:.55rem 1rem;border-radius:8px;z-index:9999;opacity:0;transform:translateY(8px) scale(.97);transition:all .22s cubic-bezier(.34,1.56,.64,1);pointer-events:none;box-shadow:var(--shadow-md)}
    #toast.show{opacity:1;transform:translateY(0) scale(1)}

    /* ── UPTIME REDESIGN ── */
    .ut-topbar{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:.6rem;margin-bottom:1rem}
    .ut-tabs{display:inline-flex;background:var(--surface);border:1px solid var(--border);border-radius:8px;overflow:hidden;padding:.15rem}
    .ut-tab{padding:.32rem 1rem;background:transparent;border:none;color:var(--muted);font-size:.78rem;font-weight:500;cursor:pointer;transition:all .15s;font-family:'Inter',sans-serif;border-radius:6px}
    .ut-tab.active{background:var(--blue);color:#fff;box-shadow:0 1px 4px rgba(59,130,246,.3)}
    .ut-tab:hover:not(.active){background:var(--row-hover);color:var(--text)}
    .ut-live{display:inline-flex;align-items:center;gap:.4rem;font-size:.72rem;color:var(--green);font-weight:600}
    .ut-live-dot{width:7px;height:7px;border-radius:50%;background:var(--green);animation:ut-pulse 1.4s infinite}
    @keyframes ut-pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.5;transform:scale(.85)}}
    .ut-height{font-size:.72rem;color:var(--muted);font-weight:500}

    .ut-leg-dot.p{background:#f59e0b}

    /* ── WALLET & MODAL ── */

    /* ── PAGE LOAD BAR ── */
    #load-bar{position:fixed;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,var(--accent),var(--blue));z-index:9999;transform-origin:left center;transform:scaleX(0);opacity:0;transition:opacity .2s}
    #load-bar.running{opacity:1;animation:lbar 1.4s ease-in-out infinite alternate}
    #load-bar.done{opacity:0;transform:scaleX(1);animation:none;transition:opacity .35s,transform .1s}

    .endpt-row{display:flex;align-items:center;gap:.55rem;padding:.5rem .7rem;border-radius:8px;border:1px solid var(--border);cursor:pointer;transition:all .15s;background:var(--surface)}

    /* ── STAKING TABLE ── */
    .stk-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:.75rem;margin-bottom:1.25rem}

    .stk-vppct{font-size:.7rem;color:var(--muted)}
    .stk-change{font-size:.8rem;font-weight:600;color:#22c55e}
    .btn-delegate{background:linear-gradient(135deg,#f97316,#ef4444);color:#fff;border:none;border-radius:7px;padding:.32rem .85rem;font-size:.78rem;font-weight:600;cursor:pointer;transition:.15s;white-space:nowrap}

    @media(max-width:768px){

    }
    @media(max-width:480px){
      .featured-grid{grid-template-columns:1fr}
      .chain-grid{grid-template-columns:1fr}
      .tb-search{display:none}
    }
  </style>
</head>

<script>
/* ═══════════════════════════════════════════
   CHAINS
═══════════════════════════════════════════ */
const CHAINS = [
  { name:'Cosmos Hub', slug:'cosmoshub', chainId:'cosmoshub-4',    denom:'uatom',  exp:6, sym:'ATOM',  color:'#6366f1', featured:false, cgId:'cosmos',
    logo:'https://raw.githubusercontent.com/cosmos/chain-registry/master/cosmoshub/images/atom.svg',
    rest:'https://rest.cosmos.directory/cosmoshub' },
  { name:'Lava',       slug:'lava',      chainId:'lava-mainnet-1', denom:'ulava',  exp:6, sym:'LAVA',  color:'#e04b1a', featured:true, cgId:'lava-network',
    logo:'https://raw.githubusercontent.com/cosmos/chain-registry/master/lava/images/lava.png',
    rest:'https://rest.cosmos.directory/lava' },
  { name:'Arkeo',      slug:'arkeo',     chainId:'arkeo-main-v1',  denom:'uarkeo', exp:6, sym:'ARKEO', color:'#7c3aed', featured:true,
    logo:'https://raw.githubusercontent.com/cosmos/chain-registry/master/arkeo/images/arkeo.svg',
    rest:'https://rest.cosmos.directory/arkeo' },
  { name:'Sunrise',    slug:'sunrise',   chainId:'sunrise-1',      denom:'urise',  exp:6, sym:'RISE',  color:'#f59e0b', featured:true,
    logo:'https://raw.githubusercontent.com/cosmos/chain-registry/master/sunrise/images/sunrise.png',
    rest:'https://rest.cosmos.directory/sunrise' },
  { name:'BitBadges',  slug:'bitbadges', chainId:'bitbadges-1',    denom:'ubadge', exp:9, sym:'BADGE', color:'#10b981', featured:true,
    logo:'https://raw.githubusercontent.com/cosmos/chain-registry/master/bitbadges/images/badge_logo.svg',
    rest:'https://rest.cosmos.directory/bitbadges' },
  { name:'Kopi',       slug:'kopi',      chainId:'luwak-1',        denom:'uskopi', exp:6, sym:'KOPI',  color:'#92400e', featured:true,
    logo:'https://raw.githubusercontent.com/cosmos/chain-registry/master/kopi/images/kopi.svg',
    rest:'https://rest.cosmos.directory/kopi' },
  { name:'Paxi',       slug:'paxi',      chainId:'paxi-1',         denom:'upaxi',  exp:6, sym:'PAXI',  color:'#a855f7', featured:true,
    logo:'https://raw.githubusercontent.com/cosmos/chain-registry/master/paxi/images/paxi.png',
    rest:'https://rest.cosmos.directory/paxi' },
  { name:'KiiChain',   slug:'kiichain',  chainId:'kiichain-1',     denom:'ukii',   exp:6, sym:'KII',   color:'#0ea5e9', featured:false,
    logo:'https://raw.githubusercontent.com/cosmos/chain-registry/master/kiichain/images/kii.png',
    rest:'https://rest.cosmos.directory/kiichain' },
  { name:'Safrochain', slug:'safrochain',chainId:'safro-testnet-1',denom:'usaf',   exp:6, sym:'SAF',   color:'#ef4444', featured:false,
    logo:'https://raw.githubusercontent.com/stilucky/my-web/0dfb22b24f88d584caf9fe6b8b29c72c99b06b1d/san.jpg',
    rest:'https://rest.cosmos.directory/safrochain' },

];

const NAV = [
  { id:'dashboard',    label:'Dashboard'    },
  { id:'governance',   label:'Governance'   },
  { id:'staking',      label:'Staking'      },
  { id:'blocks',       label:'Blocks'       },
  { id:'transactions', label:'Transactions' },
  { id:'uptime',       label:'Uptime'       },
  { id:'ibc',          label:'IBC'          },
  { id:'supply',       label:'Supply'       },
  { id:'parameters',   label:'Parameters'   },
  { id:'consensus',    label:'Consensus'    },
  { id:'cosmwasm',     label:'Cosmwasm'     },
  { id:'statesync',    label:'State Sync'   },
  { id:'widgets',      label:'Widgets'      },
];

/* ═══════════════════════════════════════════
   STATE
═══════════════════════════════════════════ */
let cur = -1;
let view = '';
let refreshT = null;
let _topbarT = null;
let blockH = null;
let favs = new Set(JSON.parse(localStorage.getItem('stilucky-favorites') || '[]'));
let _customEndpoints = JSON.parse(localStorage.getItem('stilucky-endpoints') || '{}');

/* ═══════════════════════════════════════════
   URL ROUTING
═══════════════════════════════════════════ */
let _isPopping = false;

function _pushRoute(v, sub) {
  if (_isPopping) return;
  const slug = cur >= 0 ? CHAINS[cur].slug : '';
  let hash = '';
  if (v === 'favorites') hash = '#favorites';
  else if (slug && v && v !== 'home') hash = '#' + slug + '/' + v + (sub ? '/' + sub : '');
  history.pushState({slug, v, sub: sub||''}, '', hash || (location.pathname + location.search));
}

function _parseHash() {
  const h = location.hash.slice(1);
  if (!h) return {v:'home', slug:'', sub:''};
  const p = h.split('/');
  if (p[0] === 'favorites') return {v:'favorites', slug:'', sub:''};
  return {slug:p[0], v:p[1]||'dashboard', sub:p.slice(2).join('/')};
}

function _restoreChain(slug) {
  const idx = CHAINS.findIndex(x => x.slug === slug);
  if (idx < 0) return false;
  cur = idx;
  const ch = CHAINS[idx];
  $('chainNavSection').style.display = '';
  $('chainNavHd').innerHTML = chainLogoImg(ch, 22, 'sb-chain-hd-logo') + '<span class="sb-chain-hd-name">' + ch.name + '</span>';
  updateTopbar();
  _startTopbarPoller();
  return true;
}

/* ═══════════════════════════════════════════
   UTILS
═══════════════════════════════════════════ */
const $ = id => document.getElementById(id);
const fmt = n => Number(n).toLocaleString();
const chain = () => {
  if (cur < 0) return null;
  const c = CHAINS[cur];
  const r = _customEndpoints[c.slug];
  return r ? {...c, rest: r} : c;
};

function timeAgo(iso) {
  const s = Math.floor((Date.now() - new Date(iso)) / 1000);
  if (s < 60)   return s + 's ago';
  if (s < 3600) return Math.floor(s/60) + 'm ago';
  return Math.floor(s/3600) + 'h ago';
}

function fmtTokens(raw, exp, sym) {
  if (raw == null || raw === '' || raw === '0') return '0 ' + sym;
  const n = Number(raw) / Math.pow(10, exp);
  if (n >= 1e9) return (n/1e9).toFixed(2) + 'B ' + sym;
  if (n >= 1e6) return (n/1e6).toFixed(2) + 'M ' + sym;
  if (n >= 1e3) return (n/1e3).toFixed(2) + 'K ' + sym;
  return n.toFixed(2) + ' ' + sym;
}

function fmtUSD(n) {
  if(n==null) return '—';
  if(n>=1e9) return '$'+(n/1e9).toFixed(2)+'B';
  if(n>=1e6) return '$'+(n/1e6).toFixed(2)+'M';
  if(n>=1e3) return '$'+(n/1e3).toFixed(1)+'K';
  return '$'+n.toFixed(2);
}

function shortMsg(types) {
  if (!types || !types.length) return '—';
  return (types[0] || '').split('.').pop().replace(/^Msg/, '') || '—';
}

function statusBadge(s) {
  const map = {
    PROPOSAL_STATUS_PASSED:         ['Passed',   'green'],
    PROPOSAL_STATUS_REJECTED:       ['Rejected', 'red'],
    PROPOSAL_STATUS_VOTING_PERIOD:  ['Voting',   'cyan'],
    PROPOSAL_STATUS_DEPOSIT_PERIOD: ['Deposit',  'yellow'],
    PROPOSAL_STATUS_FAILED:         ['Failed',   'red'],
    PROPOSAL_STATUS_UNSPECIFIED:    ['Unknown',  'muted'],
  };
  const [label, cls] = map[s] || [s || '—', 'muted'];
  return `<span class="badge ${cls}">${label}</span>`;
}

const _fb = {};

function chainLogoImg(c, sz, cls) {
  const fb = `<div class="${cls}-fb" style="width:${sz}px;height:${sz}px;background:${c.color}22;border:1px solid ${c.color}55;color:${c.color}">${c.name[0]}</div>`;
  if (!c.logo) return fb;
  const k = `${c.slug}_${cls}_${sz}`;
  _fb[k] = fb;
  return `<img class="${cls}" width="${sz}" height="${sz}" src="${c.logo}" alt="${c.name}" onerror="_fb['${k}']&&(this.outerHTML=_fb['${k}'])" />`;
}

async function apiFetch(url, ms=9000) {
  const ac = new AbortController();
  const t = setTimeout(() => ac.abort(), ms);
  try {
    const r = await fetch(url, { signal: ac.signal });
    clearTimeout(t);
    if (!r.ok) throw new Error(r.status);
    return await r.json();
  } catch(e) { clearTimeout(t); throw e; }
}

function _barOn() {
  const b=$('load-bar'); if(!b) return;
  b.className=''; void b.offsetWidth;
  b.className='running';
}
function _barOff() {
  const b=$('load-bar'); if(!b) return;
  b.className='done';
  setTimeout(()=>{ if(b.className==='done') b.className=''; }, 400);
}

function setContent(html) {
  $('content').innerHTML = html;
  _barOff();
  if (cur>=0 && view) _pageCache[CHAINS[cur].slug+'/'+view] = html;
}

function showLoading() {
  _barOn();
  const key = cur>=0&&view ? CHAINS[cur].slug+'/'+view : null;
  const cached = key && _pageCache[key];
  if (cached) {
    $('content').innerHTML = cached;
  } else {
    $('content').innerHTML = '<div class="p-empty">Loading…</div>';
  }
}

let toastT;
function showToast(m) {
  const t = $('toast');
  t.textContent = m;
  t.classList.add('show');
  clearTimeout(toastT);
  toastT = setTimeout(() => t.classList.remove('show'), 2400);
}

function _startTopbarPoller() {
  clearInterval(_topbarT);
  _topbarT = setInterval(async () => {
    const c = chain(); if (!c) return;
    try {
      const d = await apiFetch(c.rest + '/cosmos/base/tendermint/v1beta1/blocks/latest');
      const nh = parseInt(d.block?.header?.height || 0);
      if (nh && nh > (blockH || 0)) {
        blockH = nh; setTopbarBlock(nh);
        if (view === 'dashboard') {
          const bv = $('dashLatestBlock'); if (bv) bv.textContent = '#' + fmt(nh);
          const bt = $('dashLatestBlockTime'); if (bt && d.block?.header?.time) bt.textContent = timeAgo(d.block.header.time);
        }
      }
    } catch(e) {}
  }, 1000);
}

function goHome() { navigate('home'); }

function navigate(v) {
  if (v !== 'home' && v !== 'favorites' && cur < 0) {
    return showToast('Please select a chain first');
  }
  view = v;
  clearInterval(refreshT);
  _pushRoute(v);

  document.querySelectorAll('.nav-item').forEach(el =>
    el.classList.toggle('active', el.dataset.view === v));
  $('navAll').classList.toggle('active', v === 'home');
  $('navFav').classList.toggle('active', v === 'favorites');

  if (v === 'home' || v === 'favorites') {
    cur = -1;
    clearInterval(_topbarT);
    $('chainNavSection').style.display = 'none';
    updateTopbar();
  }

  (VIEWS[v] || viewHome)();
}

function toggleFav(event, slug) {
  event.stopPropagation();
  if (favs.has(slug)) favs.delete(slug);
  else favs.add(slug);
  localStorage.setItem('stilucky-favorites', JSON.stringify([...favs]));
  updateFavBadge();
  // update all star buttons for this slug
  document.querySelectorAll(`[data-fav="${slug}"]`).forEach(btn => {
    btn.classList.toggle('on', favs.has(slug));
    btn.textContent = favs.has(slug) ? '★' : '☆';
  });
}

async function loadFeaturedStats(c, i) {
  const [bR, vR, pR, iR] = await Promise.allSettled([
    apiFetch(c.rest + '/cosmos/base/tendermint/v1beta1/blocks/latest', 6000),
    apiFetch(c.rest + '/cosmos/staking/v1beta1/validators?status=BOND_STATUS_BONDED&pagination.limit=200', 6000),
    apiFetch(c.rest + '/cosmos/staking/v1beta1/pool', 6000),
    apiFetch(c.rest + '/cosmos/mint/v1beta1/inflation', 6000),
  ]);
  const h   = parseInt(bR.value?.block?.header?.height || 0);
  const vlen = vR.value?.validators?.length || 0;
  const bonded = pR.value?.pool?.bonded_tokens;
  const inf  = iR.value?.inflation;
  const eb = $('fcb-' + i); if (eb) eb.textContent = h ? '#' + fmt(h) : '—';
  const ev = $('fcv-' + i); if (ev) ev.textContent = vlen || '—';
  const ea = $('fca-' + i); if (ea) ea.textContent = bonded ? fmtTokens(bonded, c.exp, c.sym) : '—';
  const ei = $('fci-' + i); if (ei) ei.textContent = inf ? (parseFloat(inf) * 100).toFixed(1) + '%' : '—';
}

function filterChains(q) {
  const lq = q.toLowerCase();
  document.querySelectorAll('.cc').forEach(el => {
    const name = (el.dataset.name || '').toLowerCase();
    el.style.display = (!q || name.includes(lq)) ? '' : 'none';
  });
}

async function viewDashboard() {
  showLoading();
  const c = chain();
  const base = c.rest;
  const [bR, pR, sR, iR, vR, cgR, balR, delR, unbR, rewR] = await Promise.allSettled([
    apiFetch(base+'/cosmos/base/tendermint/v1beta1/blocks/latest'),
    apiFetch(base+'/cosmos/staking/v1beta1/pool'),
    apiFetch(base+'/cosmos/bank/v1beta1/supply?pagination.limit=5'),
    apiFetch(base+'/cosmos/mint/v1beta1/inflation'),
    apiFetch(base+'/cosmos/staking/v1beta1/validators?status=BOND_STATUS_BONDED&pagination.limit=200'),
    c.cgId
      ? fetch(`https://api.coingecko.com/api/v3/simple/price?ids=${c.cgId}&vs_currencies=usd&include_24hr_change=true&include_market_cap=true&include_24hr_vol=true`).then(r=>r.json()).catch(()=>null)
      : Promise.resolve(null),
    _walletAddr ? apiFetch(base+`/cosmos/bank/v1beta1/balances/${_walletAddr}`) : Promise.resolve(null),
    _walletAddr ? apiFetch(base+`/cosmos/staking/v1beta1/delegations/${_walletAddr}?pagination.limit=100`) : Promise.resolve(null),
    _walletAddr ? apiFetch(base+`/cosmos/staking/v1beta1/delegators/${_walletAddr}/unbonding_delegations`) : Promise.resolve(null),
    _walletAddr ? apiFetch(base+`/cosmos/distribution/v1beta1/delegators/${_walletAddr}/rewards`) : Promise.resolve(null),
  ]);

  const block    = bR.value?.block;
  const height   = parseInt(block?.header?.height || 0);
  const pool     = pR.value?.pool;
  const supplyArr= sR.value?.supply || [];
  const inflation= iR.value?.inflation;
  const vals     = vR.value?.validators || [];
  if (height) { blockH = height; setTopbarBlock(height); }

  const mainSup  = supplyArr.find(s=>s.denom===c.denom) || supplyArr[0];
  const bondedTok= fmtTokens(pool?.bonded_tokens, c.exp, c.sym);
  const supStr   = fmtTokens(mainSup?.amount, c.exp, c.sym);
  const infStr   = inflation ? (parseFloat(inflation)*100).toFixed(2)+'%' : 'N/A';
  const ratio    = (pool?.bonded_tokens && mainSup?.amount)
    ? (Number(pool.bonded_tokens)/Number(mainSup.amount)*100).toFixed(1)+'%' : '—';

  /* ── price ── */
  const priceObj = cgR.value?.[c.cgId] ?? null;
  const usdPrice  = priceObj?.usd ?? null;
  const change24h = priceObj?.usd_24h_change ?? null;
  const mktCap    = priceObj?.usd_market_cap ?? null;
  const vol24h    = priceObj?.usd_24h_vol ?? null;

  const priceCards = usdPrice !== null ? `
    <div class="stat-card">
      <div class="sc-lbl">${c.sym} Price</div>
      <div class="sc-val">$${usdPrice<0.01?usdPrice.toFixed(6):usdPrice<1?usdPrice.toFixed(4):usdPrice.toFixed(2)}</div>
      <div class="sc-sub" style="color:${change24h>=0?'var(--green)':'var(--red)'}">${change24h>=0?'+':''}${(change24h||0).toFixed(2)}% 24h</div>
    </div>
    <div class="stat-card">
      <div class="sc-lbl">Market Cap</div>
      <div class="sc-val">${fmtUSD(mktCap)}</div>
      <div class="sc-sub">Vol ${fmtUSD(vol24h)} 24h</div>
    </div>` : '';

  /* ── wallet ── */
  let walletHtml = '';
  if (_walletAddr) {
    const balances     = balR.value?.balances || [];
    const mainBal      = balances.find(b=>b.denom===c.denom);
    const availRaw     = BigInt(mainBal?.amount||'0');
    const availStr     = fmtTokens(String(availRaw), c.exp, c.sym);

    const delegations  = delR.value?.delegation_responses || [];
    const delegatedRaw = delegations.reduce((s,d)=>s+BigInt(d.balance?.amount||'0'), BigInt(0));
    const delegatedStr = fmtTokens(String(delegatedRaw), c.exp, c.sym);

    const unbondings   = unbR.value?.unbonding_responses || [];
    const unbondingRaw = unbondings.reduce((s,u)=>s+(u.entries||[]).reduce((ss,e)=>ss+BigInt(e.balance||'0'),BigInt(0)), BigInt(0));
    const unbondingStr = fmtTokens(String(unbondingRaw), c.exp, c.sym);

    const rewardCoins  = rewR.value?.total || [];
    const rewardMain   = rewardCoins.find(r=>r.denom===c.denom);
    const rewardRaw    = rewardMain ? Math.floor(parseFloat(rewardMain.amount)) : 0;
    const rewardsStr   = fmtTokens(String(rewardRaw), c.exp, c.sym);
    const hasRewards   = rewardRaw > 0;

    /* per-validator rewards map */
    const perValRew = {};
    (rewR.value?.rewards || []).forEach(r => {
      const coin = (r.reward||[]).find(rc=>rc.denom===c.denom);
      perValRew[r.validator_address] = coin ? Math.floor(parseFloat(coin.amount)) : 0;
    });

    /* validator name + identity map */

    vals.forEach(v => { valInfoMap[v.operator_address] = v; });

    const totalTokens = (Number(availRaw)+Number(delegatedRaw)+Number(unbondingRaw)+rewardRaw) / Math.pow(10,c.exp);
    const totalUSD    = usdPrice ? '$'+(totalTokens*usdPrice).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}) : null;
    const addrShort   = _walletAddr.slice(0,14)+'…'+_walletAddr.slice(-6);

        </div>
      </div>
      <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:.5rem;padding:.75rem .9rem .6rem">
        <div class="stat-card" style="text-align:center">
          <div class="sc-lbl">Available</div>
          <div class="sc-val" style="font-size:1rem">${availStr}</div>
        </div>

async function loadDashTxs(base, h, c) {
  const el=$('dashTxs'); if(!el) return;
  let txs=[];
  for(let i=h; i>=h-4 && txs.length<10; i--) {
    try {
      const d=await apiFetch(`${base}/cosmos/tx/v1beta1/txs?events=tx.height=${i}&pagination.limit=10`);
      txs=[...txs,...(d?.tx_responses||d?.txs||[])];
    } catch(e){}
  }
  if(!el) return;
  if(!txs.length){el.innerHTML='<div class="p-empty">No transactions in recent blocks</div>';return;}
  let html='';
  txs.slice(0,10).forEach(tx=>{
    const hash=tx.txhash||'—';
    const type=shortMsg((tx.tx?.body?.messages||[]).map(m=>m['@type']));
    const ago=tx.timestamp?timeAgo(tx.timestamp):'—';
    const m0=(tx.tx?.body?.messages||[])[0]||{};
    let amt='—';
    if(Array.isArray(m0.amount)&&m0.amount[0]) amt=fmtTokens(m0.amount[0].amount,c.exp,c.sym);
    else if(m0.amount?.amount) amt=fmtTokens(m0.amount.amount,c.exp,c.sym);
    html+=`<div class="row-item" onclick="copyTx('${hash}')">
      <div class="ri-left"><div class="ri-icon">↔</div>
        <div><div class="ri-main mono sm">${hash.slice(0,14)}…${hash.slice(-6)}</div>
        <div class="ri-sub">${type}</div></div></div>
      <div class="ri-right"><div class="ri-val">${amt}</div><div class="ri-time">${ago}</div></div>
    </div>`;
  });
  if(el) el.innerHTML=html;
}

function copyTx(h){navigator.clipboard&&navigator.clipboard.writeText(h);showToast('Copied: '+h.slice(0,20)+'…');}

    _customEndpoints[slug] = url;

  showToast('Endpoint changed. Reloading…');

/* ═══════════════════════════════════════════
   WALLET & DELEGATE
═══════════════════════════════════════════ */
let _cosmjsMod = null;
async function _getCosmJS() {
  if (!_cosmjsMod) {
    const mod = await import('https://esm.sh/@cosmjs/stargate@0.32.4?bundle');
    // Handle both ESM named exports and CJS-wrapped default exports
    _cosmjsMod = mod.SigningStargateClient ? mod : (mod.default || mod);
  }
  return _cosmjsMod;
}

function _encodeTxRaw(bodyBytes, authInfoBytes, signatures) {
  function varint(n) {
    const buf = [];
    while (n > 0x7f) { buf.push((n & 0x7f) | 0x80); n >>>= 7; }
    buf.push(n); return buf;
  }
  function field(num, bytes) {
    return new Uint8Array([(num << 3) | 2, ...varint(bytes.length), ...bytes]);
  }
  const parts = [field(1, bodyBytes), field(2, authInfoBytes), ...signatures.map(s => field(3, s))];
  const out = new Uint8Array(parts.reduce((s, p) => s + p.length, 0));
  let i = 0; for (const p of parts) { out.set(p, i); i += p.length; }
  return out;
}

async function _signAndBroadcast(msgs, gasPerMsg = 200000) {
  const c = chain();
  if (!window.keplr) throw new Error('Keplr wallet not found');

  const cosmjs = await _getCosmJS();
  const SigningStargateClient = cosmjs.SigningStargateClient;
  if (!SigningStargateClient) throw new Error('CosmJS failed to load. Please refresh and try again.');

  // getOfflineSignerAuto is async and handles hardware wallets correctly
  const signer = window.keplr.getOfflineSignerAuto
    ? await window.keplr.getOfflineSignerAuto(c.chainId)
    : window.keplr.getOfflineSigner(c.chainId);

  const accRes = await apiFetch(c.rest + `/cosmos/auth/v1beta1/accounts/${_walletAddr}`);
  const rawAcc = accRes?.account;
  // Support both standard and vesting/module account types
  const acc = rawAcc?.base_account || rawAcc?.base_vesting_account?.base_account || rawAcc;
  const accountNumber = parseInt(acc?.account_number ?? 0);
  const sequence = parseInt(acc?.sequence ?? 0);

  const client = await SigningStargateClient.offline(signer);
  const gasLimit = msgs.length * gasPerMsg;
  const fee = { amount: [{ denom: c.denom, amount: String(Math.ceil(gasLimit * 0.025)) }], gas: String(gasLimit) };
  const txRaw = await client.sign(_walletAddr, msgs, fee, '', { accountNumber, sequence, chainId: c.chainId });

  const txBytes = _encodeTxRaw(txRaw.bodyBytes, txRaw.authInfoBytes, txRaw.signatures);
  let b64 = ''; for (let i = 0; i < txBytes.length; i++) b64 += String.fromCharCode(txBytes[i]);
  b64 = btoa(b64);

  const res = await fetch(c.rest + '/cosmos/tx/v1beta1/txs', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ tx_bytes: b64, mode: 'BROADCAST_MODE_SYNC' })
  });
  const data = await res.json();
  const txr = data?.tx_response || data;
  if (txr?.code && txr.code !== 0) throw new Error(txr.raw_log || txr.log || 'tx failed');
  return txr?.txhash || '?';
}

function updateWalletBtn() {
  const btn=document.getElementById('walletBtn');
  if(!btn) return;
  if(_walletAddr){
    const short=_walletAddr.slice(0,8)+'…'+_walletAddr.slice(-4);

    btn.classList.add('connected');
    btn.onclick=disconnectWallet;
  } else {
    btn.textContent='⬡ Connect';
    btn.classList.remove('connected');
    btn.onclick=connectWallet;
  }

async function connectWallet() {
  if(!window.keplr) return showToast('Keplr wallet not found. Please install the Keplr extension.');
  if(cur<0) return showToast('Please select a chain first.');
  const c=chain();
  try {
    await keplr.enable(c.chainId);
  } catch(e) {
    try {
      const regRes=await fetch(`https://raw.githubusercontent.com/cosmos/chain-registry/master/${c.slug}/chain.json`);
      const reg=await regRes.json();
      const rpc=reg.apis?.rpc?.[0]?.address||'';
      const rest=reg.apis?.rest?.[0]?.address||c.rest;
      const pre=reg.bech32_prefix||c.slug;
      await keplr.experimentalSuggestChain({
        chainId:c.chainId, chainName:c.name, rpc, rest,
        bip44:{coinType:reg.slip44||118},
        bech32Config:{
          bech32PrefixAccAddr:pre, bech32PrefixAccPub:pre+'pub',
          bech32PrefixValAddr:pre+'valoper', bech32PrefixValPub:pre+'valoperpub',
          bech32PrefixConsAddr:pre+'valcons', bech32PrefixConsPub:pre+'valconspub',
        },
        currencies:[{coinDenom:c.sym,coinMinimalDenom:c.denom,coinDecimals:c.exp}],
        feeCurrencies:[{coinDenom:c.sym,coinMinimalDenom:c.denom,coinDecimals:c.exp,gasPriceStep:{low:.01,average:.025,high:.04}}],
        stakeCurrency:{coinDenom:c.sym,coinMinimalDenom:c.denom,coinDecimals:c.exp},
      });
      await keplr.enable(c.chainId);
    } catch(e2) {
      return showToast('Cannot connect: '+(e2.message||e2));
    }
  }
  try {
    const signer=keplr.getOfflineSigner(c.chainId);
    const accounts=await signer.getAccounts();
    _walletAddr=accounts[0].address;
    updateWalletBtn();
    showToast('Connected: '+_walletAddr.slice(0,12)+'…');
    if (view === 'dashboard') viewDashboard();
  } catch(e) {
    showToast('Failed to get account: '+(e.message||e));
  }
}

function disconnectWallet() {
  _walletAddr='';
  updateWalletBtn();
  showToast('Wallet disconnected.');
}

// Proper bech32 decode → re-encode with valoper prefix
function _toValoperAddr(delegatorAddr) {
  const CS = 'qpzry9x8gf2tvdw0s3jn54khce6mua7l';
  const GEN = [0x3b6a57b2,0x26508e6d,0x1ea119fa,0x3d4233dd,0x2a1462b3];

  function polymod(v) {
    let c=1;
    for (const d of v) { const b=c>>25; c=((c&0x1ffffff)<<5)^d; for(let i=0;i<5;i++) if((b>>i)&1) c^=GEN[i]; }
    return c;
  }
  function hrpExpand(hrp) {
    const r=[];
    for (let i=0;i<hrp.length;i++) r.push(hrp.charCodeAt(i)>>5);
    r.push(0);
    for (let i=0;i<hrp.length;i++) r.push(hrp.charCodeAt(i)&31);
    return r;
  }
  function createChecksum(hrp, data) {
    const pm = polymod([...hrpExpand(hrp),...data,0,0,0,0,0,0])^1;
    return Array.from({length:6},(_,i)=>(pm>>(5*(5-i)))&31);
  }
  function convertbits(data, from, to, pad=true) {
    let acc=0,bits=0; const maxv=(1<<to)-1,r=[];
    for (const v of data) { acc=(acc<<from)|v; bits+=from; while(bits>=to){bits-=to;r.push((acc>>bits)&maxv);} }
    if(pad&&bits>0) r.push((acc<<(to-bits))&maxv);
    return r;
  }

  try {
    const s = delegatorAddr.toLowerCase();
    const sep = s.lastIndexOf('1');
    const hrp = s.slice(0, sep);
    // strip 6-char checksum, decode data chars to 5-bit values
    const d5 = Array.from(s.slice(sep+1, s.length-6), c=>CS.indexOf(c));
    // 5-bit → 8-bit raw address bytes
    const bytes = convertbits(d5, 5, 8, false);
    // 8-bit → 5-bit for new prefix
    const newHrp = hrp + 'valoper';
    const newD5 = convertbits(bytes, 8, 5);
    const checksum = createChecksum(newHrp, newD5);
    return newHrp + '1' + [...newD5,...checksum].map(d=>CS[d]).join('');
  } catch(e) {
    // last-resort string replacement (wrong checksum but lets API return 404 cleanly)
    return delegatorAddr.replace(/^([a-z]+)1/, '$1valoper1');
  }
}

async function claimRewards(btn, specificValAddrs) {
  if(!_walletAddr) return connectWallet();
  const origLabel = btn ? btn.textContent : 'Claim ↗';
  if(btn){btn.disabled=true;btn.textContent='Claiming…';}
  const c=chain();
  try {
    let valAddrs = specificValAddrs;
    if(!valAddrs || !valAddrs.length) {
      const delRes=await apiFetch(c.rest+`/cosmos/staking/v1beta1/delegations/${_walletAddr}?pagination.limit=100`);
      valAddrs=(delRes?.delegation_responses||[]).map(d=>d.delegation.validator_address);
    }
    if(!valAddrs || !valAddrs.length){
      if(btn){btn.disabled=false;btn.textContent=origLabel;}
      return showToast('No delegations found.');
    }

    const msgs = [];
    for (const va of valAddrs) {
      msgs.push({typeUrl:'/cosmos.distribution.v1beta1.MsgWithdrawDelegatorReward',value:{delegatorAddress:_walletAddr,validatorAddress:va}});
    }

    // Also claim validator commission if this wallet is a validator operator
    const myValoper = _toValoperAddr(_walletAddr);
    try {
      const commRes = await apiFetch(c.rest+`/cosmos/distribution/v1beta1/validators/${myValoper}/commission`);
      const commCoins = commRes?.commission?.commission || [];
      const hasComm = commCoins.some(coin => parseFloat(coin.amount) >= 1);
      if (hasComm) {
        msgs.push({typeUrl:'/cosmos.distribution.v1beta1.MsgWithdrawValidatorCommission',value:{validatorAddress:myValoper}});
      }
    } catch(_){} // not a validator — skip silently

    const gas = 150000 + msgs.length * 40000;
    const txhash = await _signAndBroadcast(msgs, gas);
    if(btn){btn.disabled=false;btn.textContent=origLabel;}
    showToast('Claimed! Tx: '+txhash.slice(0,16)+'…');
    viewDashboard();
  } catch(e) {
    if(btn){btn.disabled=false;btn.textContent=origLabel;}
    console.error('Claim error:',e);
    showToast('Error: '+(e.message||String(e)).slice(0,160));
  }
}

async function claimSingle(btn, valAddr) {
  return claimRewards(btn, [valAddr]);
}

async function _loadKeybaseAvatars(vals) {
  const toFetch=vals.filter(v=>{
    const id=v.description?.identity;
    return id&&id.length>=8&&!Object.prototype.hasOwnProperty.call(_kbCache,id);
  });
  await Promise.allSettled(toFetch.map(async v=>{
    const id=v.description.identity;
    try {
      const r=await fetch(`https://keybase.io/_/api/1.0/user/lookup.json?key_suffix=${id}&fields=pictures`);
      const data=await r.json();
      _kbCache[id]=data?.them?.[0]?.pictures?.primary?.url||null;
    } catch(e){ _kbCache[id]=null; }
  }));
  document.querySelectorAll('[data-kbid]').forEach(el=>{
    const id=el.dataset.kbid;
    const url=_kbCache[id];
    if(url&&el.isConnected){
      const img=document.createElement('img');
      img.className=el.className;
      img.src=url;
      img.alt='';
      img.onerror=()=>{};
      img.onload=()=>{ if(el.isConnected) el.replaceWith(img); };
    }
  });
}

async function viewStaking() {
  showLoading();
  const c=chain();
  const [aR,ubgR,ubingR,pR,inflR,slashR,stkPR]=await Promise.allSettled([
    apiFetch(c.rest+'/cosmos/staking/v1beta1/validators?status=BOND_STATUS_BONDED&pagination.limit=200'),
    apiFetch(c.rest+'/cosmos/staking/v1beta1/validators?status=BOND_STATUS_UNBONDED&pagination.limit=200'),
    apiFetch(c.rest+'/cosmos/staking/v1beta1/validators?status=BOND_STATUS_UNBONDING&pagination.limit=200'),
    apiFetch(c.rest+'/cosmos/staking/v1beta1/pool'),
    apiFetch(c.rest+'/cosmos/mint/v1beta1/inflation'),
    apiFetch(c.rest+'/cosmos/slashing/v1beta1/params'),
    apiFetch(c.rest+'/cosmos/staking/v1beta1/params'),
  ]);

  const total=Number(pR.value?.pool?.bonded_tokens||0);
  const bonded=(aR.value?.validators||[]).sort((a,b)=>Number(b.tokens)-Number(a.tokens));
  const unbonded=(ubgR.value?.validators||[]);
  const unbonding=(ubingR.value?.validators||[]);
  const activeVals=bonded.filter(v=>!v.jailed);
  const inactiveVals=[
    ...bonded.filter(v=>v.jailed),
    ...unbonding,
    ...unbonded,
  ].sort((a,b)=>Number(b.tokens)-Number(a.tokens));

  if(!activeVals.length&&!inactiveVals.length){
    setContent('<div class="p-empty error">Could not load validators.</div>');
    return;
  }

  _stkTotal=total;
  _stkMap={};
  activeVals.forEach((v,i)=>{_stkMap[v.operator_address]={v,rank:i+1,isActive:true};});
  inactiveVals.forEach((v,i)=>{_stkMap[v.operator_address]={v,rank:i+1,isActive:false};});

  /* ── stats bar data ── */
  const inflPct=inflR.value?.inflation!=null
    ?(parseFloat(inflR.value.inflation)*100).toFixed(2)+'%':'—';
  const slP=slashR.value?.params||{};
  const dblSignPct=slP.slash_fraction_double_sign!=null
    ?(parseFloat(slP.slash_fraction_double_sign)*100).toFixed(2)+'%':'—';
  const downtimePct=slP.slash_fraction_downtime!=null
    ?(parseFloat(slP.slash_fraction_downtime)*100).toFixed(2)+'%':'—';
  const rawUBT=stkPR.value?.params?.unbonding_time||'';
  let unbondingDays='—';
  if(rawUBT){const secs=parseInt(rawUBT);if(!isNaN(secs))unbondingDays=Math.round(secs/86400)+' days';}

  const statsBar=`<div class="stk-stats">
    <div class="stk-stat"><div class="stk-stat-label">Inflation</div><div class="stk-stat-value">${inflPct}</div></div>
    <div class="stk-stat"><div class="stk-stat-label">Unbonding Time</div><div class="stk-stat-value">${unbondingDays}</div></div>
    <div class="stk-stat"><div class="stk-stat-label">Double Sign Slashing</div><div class="stk-stat-value">${dblSignPct}</div></div>
    <div class="stk-stat"><div class="stk-stat-label">Downtime Slashing</div><div class="stk-stat-value">${downtimePct}</div></div>
  </div>`;

  /* ── row builder ── */
  function rowsFor(vals,isActive){
    return vals.map((v,i)=>{
      const rank=i+1;
      const name=v.description?.moniker||'—';
      const website=v.description?.website||'';
      const comm=(parseFloat(v.commission?.commission_rates?.rate||0)*100).toFixed(1)+'%';
      const vp=fmtTokens(v.tokens,c.exp,c.sym);
      const pct=total?(Number(v.tokens)/total*100).toFixed(2)+'%':'—';
      const opa=v.operator_address;
      const jailBadge=v.jailed?'<span class="badge red" style="font-size:.6rem;padding:.05rem .3rem;margin-left:.3rem">Jailed</span>':'';
      const siteTxt=website?`<a class="stk-val-site" href="${website}" target="_blank" onclick="event.stopPropagation()">${website.replace(/^https?:\/\//,'')}</a>`:'';
      const identityId=v.description?.identity||'';
      const cachedUrl=identityId&&_kbCache[identityId];
      const avatarEl=cachedUrl
        ?`<img class="stk-avatar" src="${cachedUrl}" alt="">`
        :`<div class="stk-avatar"${identityId&&identityId.length>=8?` data-kbid="${identityId}"`:''}  style="display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.95rem;color:#fff;background:linear-gradient(135deg,var(--blue),#7c3aed)">${name[0]?.toUpperCase()||'?'}</div>`;
      return `<tr onclick="viewValidatorDetail('${opa}')" style="cursor:pointer">
        <td style="color:var(--muted);font-size:.82rem;width:40px">${rank}</td>
        <td>
          <div class="stk-val-cell">
            ${avatarEl}
            <div class="stk-val-info">
              <span class="stk-val-name">${name}${jailBadge}</span>
              ${siteTxt}
            </div>
          </div>
        </td>
        <td>
          <div class="stk-vp">${vp}</div>
          <div class="stk-vppct">${pct}</div>
        </td>
        <td><span class="stk-change">—</span></td>
        <td style="font-size:.83rem">${comm}</td>
        <td><button class="btn-delegate" onclick="event.stopPropagation();showDelegateModal('${opa}')">Delegate</button></td>
      </tr>`;
    }).join('');
  }

  const popularVals=activeVals.slice(0,20);
  const popularRows=rowsFor(popularVals,true);
  const activeRows=rowsFor(activeVals,true);
  const inactiveRows=rowsFor(inactiveVals,false);

  const thead=`<thead><tr><th style="width:40px">Rank</th><th>Validator</th><th>Voting Power</th><th>24H Changes</th><th>Commission</th><th>Actions</th></tr></thead>`;

  function panel(rows,label){
    return `<div class="panel" style="padding:0;overflow:hidden">
      <table class="data-table" style="margin:0">
        ${thead}
        <tbody>${rows||`<tr><td colspan="6" class="p-empty">No ${label} validators.</td></tr>`}</tbody>
      </table>
    </div>`;
  }

  setContent(`
    ${statsBar}
    <div class="stk-tabbar">
      <button class="stk-tab"        id="stk-tab-popular"  onclick="stkTab('popular')">Popular</button>
      <button class="stk-tab active" id="stk-tab-active"   onclick="stkTab('active')">Active</button>
      <button class="stk-tab"        id="stk-tab-inactive" onclick="stkTab('inactive')">Inactive</button>
      <span class="stk-tabbar-count">${activeVals.length}/${activeVals.length+inactiveVals.length}</span>
    </div>
    <div id="stk-panel-popular"  style="display:none">${panel(popularRows,'popular')}</div>
    <div id="stk-panel-active">${panel(activeRows,'active')}</div>
    <div id="stk-panel-inactive" style="display:none">${panel(inactiveRows,'inactive')}</div>
  `);
  _loadKeybaseAvatars(activeVals.concat(inactiveVals));
}

function stkTab(which) {
  ['popular','active','inactive'].forEach(t=>{
    const p=document.getElementById('stk-panel-'+t);
    const b=document.getElementById('stk-tab-'+t);
    if(p) p.style.display=t===which?'':'none';
    if(b) b.classList.toggle('active',t===which);
  });
}

let blocksFrom = null;
async function viewBlocks() {
  showLoading();
  const c=chain();
  try {
    const d=await apiFetch(c.rest+'/cosmos/base/tendermint/v1beta1/blocks/latest');
    const h=parseInt(d.block?.header?.height||0);
    if(h){blockH=h;blocksFrom=h;setTopbarBlock(h);}
    renderBlocks(d.block,h,c);
  } catch(e){setContent('<div class="p-empty error">Failed to load blocks.</div>');}
}

function renderBlocks(latestBlock,topH,c){
  const prop=latestBlock?.header?.proposer_address||'';
  const time=latestBlock?.header?.time;
  const txs0=latestBlock?.data?.txs?.length||0;
  let rows='';
  for(let i=0;i<20;i++){
    const h=topH-i;
    const tx=i===0?txs0:Math.floor(Math.random()*20);
    const ago=i===0&&time?timeAgo(time):(i*6)+'s ago';
    rows+=`<tr onclick="showToast('Block #${fmt(h)}')">
      <td style="color:var(--accent);font-weight:500">#${fmt(h)}</td>
      <td class="mono sm">${prop?prop.slice(0,20)+'…':'—'}</td>
      <td>${tx}</td>
      <td>${ago}</td>
    </tr>`;
  }
  setContent(`<div class="panel">
    <div class="ph"><div class="pt">Blocks</div><div class="badge cyan">from #${fmt(topH)}</div></div>
    <table class="data-table">
      <thead><tr><th>Height</th><th>Proposer</th><th>Txs</th><th>Time</th></tr></thead>
      <tbody>${rows}</tbody>
    </table>
    <div class="load-more">
      <button class="btn-load" onclick="loadMoreBlocks()">Load More</button>
    </div>
  </div>`);
}

async function loadMoreBlocks(){
  if(!blocksFrom) return;
  blocksFrom -= 20;
  const c=chain();
  const btn=document.querySelector('.btn-load');
  if(btn){btn.disabled=true;btn.textContent='Loading…';}
  try{
    const d=await apiFetch(c.rest+`/cosmos/base/tendermint/v1beta1/blocks/${blocksFrom}`);
    renderBlocks(d.block,blocksFrom,c);
  }catch(e){showToast('Failed to load older blocks');}
}

async function viewTransactions() {
  showLoading();
  const c=chain();
  let h=blockH;
  if(!h){
    try{
      const d=await apiFetch(c.rest+'/cosmos/base/tendermint/v1beta1/blocks/latest');
      h=parseInt(d.block?.header?.height||0);
      blockH=h; setTopbarBlock(h);
    }catch(e){}
  }
  let txs=[];
  for(let i=h;i>=h-6&&txs.length<25;i--){
    try{
      const d=await apiFetch(`${c.rest}/cosmos/tx/v1beta1/txs?events=tx.height=${i}&pagination.limit=20`);
      txs=[...txs,...(d?.tx_responses||d?.txs||[])];
    }catch(e){}
  }
  if(!txs.length){setContent('<div class="p-empty">No transactions found in recent blocks.</div>');return;}
  let rows='';
  txs.slice(0,25).forEach(tx=>{
    const hash=tx.txhash||'—';
    const type=shortMsg((tx.tx?.body?.messages||[]).map(m=>m['@type']));
    const height2=tx.height||'—';
    const ago=tx.timestamp?timeAgo(tx.timestamp):'—';

let _utInfos=[], _utVals=[], _utTmVals=[], _utWin=10000;
let _utBlockHistory={}, _utLastHeight=0;
let _stkMap={}, _stkTotal=0;
let _walletAddr='';
const _kbCache={};
const _pageCache={};

async function viewUptime() {
  showLoading();
  _utBlockHistory={};
  _utLastHeight=0;
  const c=chain();
  const [siR,spR,vR,vsR,blkR]=await Promise.allSettled([
    apiFetch(c.rest+'/cosmos/slashing/v1beta1/signing_infos?pagination.limit=200'),
    apiFetch(c.rest+'/cosmos/slashing/v1beta1/params'),
    apiFetch(c.rest+'/cosmos/staking/v1beta1/validators?status=BOND_STATUS_BONDED&pagination.limit=200'),
    apiFetch(c.rest+'/cosmos/base/tendermint/v1beta1/validatorsets/latest?pagination.limit=200'),
    apiFetch(c.rest+'/cosmos/base/tendermint/v1beta1/blocks/latest'),
  ]);
  _utWin=parseInt(spR.value?.params?.signed_blocks_window||10000);
  _utLastHeight=parseInt(blkR.value?.block?.header?.height||0);
  const allInfos=siR.value?.info||[];
  const bondedVals=(vR.value?.validators||[]).sort((a,b)=>Number(b.tokens)-Number(a.tokens));
  const tmVals=(vsR.value?.validators||[]).sort((a,b)=>Number(b.voting_power)-Number(a.voting_power));

  if(tmVals.length){
    const infoByAddr={};
    allInfos.forEach(info=>{infoByAddr[info.address]=info;});
    _utTmVals=tmVals;
    _utVals=tmVals.map((tmv,i)=>bondedVals[i]||{description:{moniker:tmv.address?.slice(-8)||'#'+(i+1)}});
    _utInfos=tmVals.map(tmv=>infoByAddr[tmv.address]||{address:tmv.address,missed_blocks_counter:'0',index_offset:String(_utWin)});
  } else {
    _utTmVals=[];
    _utVals=bondedVals;
    _utInfos=allInfos.slice(0,bondedVals.length);
  }

  if(!_utVals.length){setContent('<div class="p-empty error">Could not load uptime data.</div>');return;}

  // Build initial 100-block history from cumulative miss rate
  const SHOW=100;
  _utInfos.forEach((info,i)=>{
    const missed=parseInt(info.missed_blocks_counter||0);
    const offset=parseInt(info.index_offset||_utWin);
    const scaledMiss=Math.min(SHOW,Math.round((missed/Math.max(offset,1))*SHOW));
    const hist=[];
    for(let j=0;j<SHOW-scaledMiss;j++) hist.push('c');
    for(let j=0;j<scaledMiss;j++) hist.push('m');
    _utBlockHistory[i]=hist;
  });

  renderUptimeBlocks();
  refreshT=setInterval(_refreshUptimeData,6000);
}

function _utItems(){
  return _utInfos.length
    ? _utInfos
    : _utVals.map(()=>({missed_blocks_counter:'0',index_offset:String(_utWin)}));
}

let _utActiveTab='blocks';

function _buildBlocksGrid(){
  return _utItems().map((info,i)=>{
    const missed=parseInt(info.missed_blocks_counter||0);
    const name=_utVals[i]?.description?.moniker||info.address?.slice(0,16)||'#'+(i+1);
    const hist=_utBlockHistory[i]||[];
    const blksHtml=hist.map(t=>`<span class="ut-blk ut-blk-${t}"></span>`).join('');
    return `<div class="ut-card" data-name="${name.toLowerCase()}">
      <div class="ut-vname-row">
        <div class="ut-vname">${i+1}.${name}</div>
        <div class="ut-missed-n ${missed>0?'has-miss':''}">${missed||0}</div>
      </div>
      <div class="ut-blkrow">${blksHtml}</div>
    </div>`;
  }).join('');
}

function _buildOverallGrid(){
  return _utItems().map((info,i)=>{
    const missed=parseInt(info.missed_blocks_counter||0);
    const offset=parseInt(info.index_offset||_utWin);
    const pct=Math.min(100,Math.max(0,((offset-missed)/Math.max(offset,1))*100));
    const name=_utVals[i]?.description?.moniker||info.address?.slice(0,20)||'#'+(i+1);
    const color=pct>=98?'#22c55e':pct>=90?'#f59e0b':'#ef4444';
    return `<div class="uto-row" data-name="${name.toLowerCase()}">

      <div class="uto-bar-bg"><div class="uto-bar-fill" style="width:${pct}%;background:${color}"></div></div>
      <span class="uto-pct" style="color:${color}">${pct.toFixed(2)}%</span>
      <span class="uto-missed">${missed} missed</span>
    </div>`;
  }).join('');
}

function _utToolbar(){

async function _refreshUptimeData(){
  if(view!=='uptime') return;
  const c=chain();
  try {
    // Step 1: check if a new block arrived (cheap call)
    const blkR=await apiFetch(c.rest+'/cosmos/base/tendermint/v1beta1/blocks/latest');
    const newHeight=parseInt(blkR?.block?.header?.height||0);
    if(!newHeight||newHeight<=_utLastHeight) return;
    const numNew=newHeight-_utLastHeight;

    // Step 2: fetch signing_infos to get accurate missed_blocks_counter delta
    const siR=await apiFetch(c.rest+'/cosmos/slashing/v1beta1/signing_infos?pagination.limit=200');
    const allInfos=siR?.info||[];
    const infoByAddr={};
    allInfos.forEach(info=>{infoByAddr[info.address]=info;});
    const prevInfos=[..._utInfos];
    _utInfos=_utTmVals.length
      ?_utTmVals.map(tmv=>infoByAddr[tmv.address]||{address:tmv.address,missed_blocks_counter:'0',index_offset:String(_utWin)})
      :allInfos.slice(0,_utVals.length);

    // Step 3: push exactly (numNew - deltaMiss) green + deltaMiss red per validator
    _utInfos.forEach((info,i)=>{
      if(!_utBlockHistory[i]) _utBlockHistory[i]=[];
      const hist=_utBlockHistory[i];
      const prevMissed=parseInt(prevInfos[i]?.missed_blocks_counter||0);
      const newMissed=parseInt(info.missed_blocks_counter||0);
      const deltaMiss=Math.max(0,newMissed-prevMissed);
      const deltaCommit=Math.max(0,numNew-deltaMiss);
      for(let j=0;j<deltaCommit;j++) hist.push('c');
      for(let j=0;j<deltaMiss;j++) hist.push('m');
      while(hist.length>100) hist.shift();
    });

    _utLastHeight=newHeight;

    // Update block height badge
    const hEl=document.querySelector('.ut-height');
    if(hEl) hEl.innerHTML=`Block <b>#${fmt(newHeight)}</b>`;

    // Update grid in-place
    const grid=$('utGrid');
    if(!grid) return;

    if(_utActiveTab==='blocks'){
      const cards=grid.querySelectorAll('.ut-card');
      _utVals.forEach((_,i)=>{
        if(!cards[i]) return;
        const info=_utInfos[i]||{};
        const missed=parseInt(info.missed_blocks_counter||0);
        const name=_utVals[i]?.description?.moniker||info.address?.slice(0,16)||'#'+(i+1);
        const hist=_utBlockHistory[i]||[];
        const blksHtml=hist.map(t=>`<span class="ut-blk ut-blk-${t}"></span>`).join('');
        cards[i].innerHTML=`<div class="ut-vname-row"><div class="ut-vname">${i+1}.${name}</div><div class="ut-missed-n ${missed>0?'has-miss':''}">${missed||0}</div></div><div class="ut-blkrow">${blksHtml}</div>`;
      });
    } else if(_utActiveTab==='overall'){
      const rows=grid.querySelectorAll('.uto-row');
      _utInfos.forEach((info,i)=>{
        if(!rows[i]) return;
        const missed=parseInt(info.missed_blocks_counter||0);
        const offset=parseInt(info.index_offset||_utWin);
        const pct=Math.min(100,Math.max(0,((offset-missed)/Math.max(offset,1))*100));
        const name=_utVals[i]?.description?.moniker||info.address?.slice(0,20)||'#'+(i+1);
        const color=pct>=98?'#22c55e':pct>=90?'#f59e0b':'#ef4444';
        rows[i].innerHTML=`<span class="uto-rank">${i+1}</span><span class="uto-name">${name}</span><div class="uto-bar-bg"><div class="uto-bar-fill" style="width:${pct}%;background:${color}"></div></div><span class="uto-pct" style="color:${color}">${pct.toFixed(2)}%</span><span class="uto-missed">${missed} missed</span>`;
      });
    }
    const q=($('utFilter')||{}).value||'';
    if(q) filterValidators(q);
  } catch(e){}
}

function _genBlocks(total,missedCount,seed){
  const arr=new Array(total).fill('c');
  const preN=Math.floor(missedCount*0.15);
  let rng=(seed*1664525+1013904223)&0x7fffffff;
  function r(){rng=(rng*1664525+1013904223)&0x7fffffff;return rng/0x7fffffff;}
  const pos=new Set();
  let attempts=0;
  while(pos.size<missedCount&&attempts<total*4){pos.add(Math.floor(r()*total));attempts++;}
  let pi=0;
  for(const p of pos){arr[p]=pi<preN?'p':'m';pi++;}
  return arr;
}

function _utTab(tab,btn){
  _utActiveTab=tab;
  document.querySelectorAll('.ut-tab').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  const q=($('utFilter')||{}).value||'';
  if(tab==='blocks') renderUptimeBlocks();
  else if(tab==='overall') renderUptimeOverall();
  if(q) setTimeout(()=>filterValidators(q),0);
}

function filterValidators(q){
  const lq=q.toLowerCase();
  document.querySelectorAll('#utGrid>[class^="ut-card"],#utGrid>.uto-row').forEach(el=>{
    el.style.display=(!q||(el.dataset.name||'').includes(lq))?'':'none';
  });
}

  const txt=`[statesync]\nenable = true\ntrust_height = ${h}\ntrust_hash = ${hash}\ntrust_period = "168h0m0s"`;
  navigator.clipboard&&navigator.clipboard.writeText(txt);
  showToast('Config copied to clipboard');
}

/* ═══════════════════════════════════════════
   VIEW: WIDGETS
═══════════════════════════════════════════ */
async function viewWidgets() {
  showLoading();
  const c=chain();
  let h='—', vals='—', inf='—';
  try {
    const [bR,vR,iR]=await Promise.allSettled([
      apiFetch(c.rest+'/cosmos/base/tendermint/v1beta1/blocks/latest'),
      apiFetch(c.rest+'/cosmos/staking/v1beta1/validators?status=BOND_STATUS_BONDED&pagination.limit=200'),
      apiFetch(c.rest+'/cosmos/mint/v1beta1/inflation'),
    ]);
    h=bR.value?.block?.header?.height?'#'+fmt(parseInt(bR.value.block.header.height)):'—';
    vals=(vR.value?.validators?.length||'—').toString();
    inf=iR.value?.inflation?(parseFloat(iR.value.inflation)*100).toFixed(2)+'%':'N/A';
  }catch(e){}

  function widget(title,stat,sub,embedCode){
    return `<div class="widget-card">
      <div class="wc-title">${title}</div>
      <div style="background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:1rem;text-align:center">
        <div style="font-size:1.5rem;font-weight:700;color:var(--accent)">${stat}</div>
        <div style="font-size:.68rem;color:var(--muted);margin-top:.25rem">${sub}</div>
      </div>
      <div class="wc-embed">${embedCode.replace(/</g,'&lt;')}</div>
      <button class="wc-copy" onclick="navigator.clipboard.writeText(${JSON.stringify(embedCode)});showToast('Embed code copied')">Copy Embed</button>
    </div>`;
  }

  const baseUrl=location.href.replace(location.search,'');
  setContent(`
    <div class="panel" style="margin-bottom:1.5rem">
      <div class="ph"><div class="pt">Embeddable Widgets</div><div class="badge cyan">${c.name}</div></div>
      <div style="padding:.9rem 1.1rem;font-size:.78rem;color:var(--muted)">
        Copy any widget's embed code to display live chain stats on your website.
      </div>
    </div>
    <div class="widget-grid">
      ${widget('Latest Block',h,c.name+' · '+c.chainId,
        `<iframe src="${baseUrl}?widget=block&chain=${c.slug}" width="200" height="80" frameborder="0"></iframe>`)}
      ${widget('Active Validators',vals,'bonded validators',
        `<iframe src="${baseUrl}?widget=validators&chain=${c.slug}" width="200" height="80" frameborder="0"></iframe>`)}
      ${widget('Inflation Rate',inf,'annual inflation',
        `<iframe src="${baseUrl}?widget=inflation&chain=${c.slug}" width="200" height="80" frameborder="0"></iframe>`)}
      ${widget('Stilucky.eth Validator','✓ Active','0 slash · 24/7 uptime',
        `<iframe src="${baseUrl}?widget=stilucky&chain=${c.slug}" width="240" height="100" frameborder="0"></iframe>`)}
    </div>`);
}

/* ═══════════════════════════════════════════
   SEARCH
═══════════════════════════════════════════ */
function doSearch(){
  const q=($('ts').value||'').trim();
  if(!q) return;
  if(cur<0){
    const m=CHAINS.findIndex(c=>c.name.toLowerCase().includes(q.toLowerCase()));
    if(m>=0){selectChain(m);return;}
    showToast('No chain matched "'+q+'"');
    return;
  }
  if(/^\d+$/.test(q)){showToast('Block #'+fmt(q)+' — navigating to Blocks');navigate('blocks');return;}
  if(q.length>=40){showToast('Searching: '+q.slice(0,20)+'…');navigate('transactions');return;}
  const m=CHAINS.findIndex(c=>c.name.toLowerCase().includes(q.toLowerCase()));
  if(m>=0){selectChain(m);return;}
  showToast('No match for "'+q+'"');
}

/* ═══════════════════════════════════════════
   SIDEBAR TOGGLE (mobile)
═══════════════════════════════════════════ */
function toggleSb(){$('sidebar').classList.toggle('open');}
document.addEventListener('click',e=>{
  if(window.innerWidth<=768&&!$('sidebar').contains(e.target)&&e.target.id!=='hbg')
    $('sidebar').classList.remove('open');
});

/* ═══════════════════════════════════════════
   THEME
═══════════════════════════════════════════ */
function toggleTheme(){
  const isDark = document.documentElement.dataset.theme === 'dark';
  const next = isDark ? 'light' : 'dark';
  document.documentElement.dataset.theme = next;
  localStorage.setItem('stilucky-theme', next);
  $('themeIcon').textContent = next === 'dark' ? '☀' : '🌙';
}

(function(){
  const saved = localStorage.getItem('stilucky-theme');
  if(saved === 'dark'){
    document.documentElement.dataset.theme = 'dark';
    const icon = $('themeIcon');
    if(icon) icon.textContent = '☀';
  }
})();

/* ═══════════════════════════════════════════
   POPSTATE — browser back / forward
═══════════════════════════════════════════ */
window.addEventListener('popstate', () => {
  _isPopping = true;
  const r = _parseHash();
  if (!r.slug || r.v === 'home') {
    cur = -1; $('chainNavSection').style.display = 'none'; updateTopbar(); viewHome();
  } else if (r.v === 'favorites') {
    cur = -1; viewFavorites();
  } else {
    _restoreChain(r.slug);
    document.querySelectorAll('.nav-item').forEach(el => el.classList.toggle('active', el.dataset.view === r.v));
    if      (r.v === 'staking' && r.sub)                         { view='staking'; viewValidatorDetail(r.sub); }
    else if (r.v === 'blocks'  && r.sub && /^\d+$/.test(r.sub)) { view='blocks';  viewBlockDetail(parseInt(r.sub)); }
    else if (r.v === 'txs'     && r.sub)                         { view='txs';     viewTxDetail(r.sub); }
    else { view=r.v; clearInterval(refreshT); (VIEWS[r.v]||viewDashboard)(); }
  }
  _isPopping = false;
});

/* ═══════════════════════════════════════════
   INIT — restore view from URL hash
═══════════════════════════════════════════ */
(function initFromURL() {
  const r = _parseHash();
  if (r.v === 'favorites')              { navigate('favorites'); return; }
  if (!r.slug || r.v === 'home')        { navigate('home');      return; }
  if (!_restoreChain(r.slug))           { navigate('home');      return; }
  if      (r.v === 'staking' && r.sub)                         { view='staking'; viewValidatorDetail(r.sub); }
  else if (r.v === 'blocks'  && r.sub && /^\d+$/.test(r.sub)) { view='blocks';  viewBlockDetail(parseInt(r.sub)); }
  else if (r.v === 'txs'     && r.sub)                         { view='txs';     viewTxDetail(r.sub); }
  else navigate(r.v);
})();
</script>
